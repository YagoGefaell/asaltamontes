# Test profile: fixed values so tests run without .env. The datasource comes from Testcontainers (@ServiceConnection).
spring.jpa.show-sql=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

asaltamontes.jwt.secret-key=test-secret-key-that-is-long-enough-for-hs256
asaltamontes.jwt.expiration=900000
asaltamontes.jwt.refresh-expiration=604800000

asaltamontes.google.client-id=test-client-id
asaltamontes.google.client-secret=test-client-secret

asaltamontes.cors.allowed-origins=http://localhost

# Uploaded images go to a throwaway folder
asaltamontes.media.dir=${java.io.tmpdir}/asaltamontes-test-media

# Rate limiting off by default in tests (many logins from 127.0.0.1); RateLimitIT turns it on
asaltamontes.rate-limit.enabled=false
