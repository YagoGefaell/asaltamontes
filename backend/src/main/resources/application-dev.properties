# Local development: SQL statements in the log (without bound parameters) and DEBUG for our own code
spring.jpa.show-sql=true
logging.level.io.github.yagogefaell.asaltamontes=DEBUG

spring.datasource.hikari.leak-detection-threshold=30000

# Vite dev server (npm run dev) included by default
asaltamontes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://127.0.0.1}
