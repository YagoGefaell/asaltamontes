spring.application.name=asaltamontes
server.address=0.0.0.0
server.port=8080

# Profiles: dev (local), prod (server, set in docker-compose), test (tests). See application-<profile>.properties.

# Connection data
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
asaltamontes.jwt.secret-key=${JWT_SECRET}
asaltamontes.jwt.expiration=${JWT_EXPIRATION_MS}
asaltamontes.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# Google OAuth
asaltamontes.google.client-id=${GOOGLE_CLIENT_ID}
asaltamontes.google.client-secret=${GOOGLE_CLIENT_SECRET}

# CORS (also applies to the WebSocket handshake)
asaltamontes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}

# Refresh token cookie: Secure only when the server is served over HTTPS (D-013)
asaltamontes.cookies.secure=${COOKIE_SECURE:false}
asaltamontes.cookies.same-site=${COOKIE_SAME_SITE:Strict}

# Actuator: only health (with liveness/readiness probes) and info, both public
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logs: request id (X-Request-Id) on every line logged while serving a request
logging.pattern.level=%5p [%X{requestId:-}]
