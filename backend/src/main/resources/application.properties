spring.application.name=asaltamontes
server.address=0.0.0.0
server.port=8080

# Profiles: dev (local), prod (server, set in docker-compose), test (tests). See application-<profile>.properties.

# Connection data
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# Schema: versioned Flyway migrations in db/migration; Hibernate only validates the entities against it.
# baseline-on-migrate: on a database that already has tables (created by the old ddl-auto=update),
# Flyway records V1 as applied without running it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
asaltamontes.jwt.secret-key=${JWT_SECRET}
asaltamontes.jwt.expiration=${JWT_EXPIRATION_MS}
asaltamontes.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# Google OAuth
asaltamontes.google.client-id=${GOOGLE_CLIENT_ID}
asaltamontes.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Email (T24a, D-025): SMTP (Resend). With an empty MAIL_HOST the emails are written to the log instead of being sent.
asaltamontes.mail.host=${MAIL_HOST:}
asaltamontes.mail.port=${MAIL_PORT:587}
asaltamontes.mail.username=${MAIL_USER:}
asaltamontes.mail.password=${MAIL_PASSWORD:}
asaltamontes.mail.from=${MAIL_FROM:Asaltamontes Female <no-reply@localhost>}
asaltamontes.mail.starttls=${MAIL_STARTTLS:true}
asaltamontes.mail.ssl=${MAIL_SSL:false}
# Only with an empty MAIL_HOST: also write the body of each email (links with tokens) in the log. Off by default (BUG-084)
asaltamontes.mail.log-body=${MAIL_LOG_BODY:false}
# Public URL of the web app, for the links in the emails
asaltamontes.mail.app-base-url=${APP_BASE_URL:http://localhost}
management.health.mail.enabled=false
# Limits for accounts with an unverified email (no communities, events, posts or new chats). Off until there is a real email.
asaltamontes.verification.enforce=${VERIFICATION_ENFORCE:false}

# CORS (also applies to the WebSocket handshake)
asaltamontes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}

# Refresh token cookie: Secure only when the server is served over HTTPS (D-013)
asaltamontes.cookies.secure=${COOKIE_SECURE:false}
asaltamontes.cookies.same-site=${COOKIE_SAME_SITE:Strict}

# Actuator: only health (with liveness/readiness probes) and info, both public
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Image uploads (T17a): files go to MEDIA_DIR (volume media_data, served by nginx as /media/)
asaltamontes.media.dir=${MEDIA_DIR:/data/media}
# Orphan cleanup (images nobody references) and per-user storage quota
asaltamontes.media.cleanup-cron=${MEDIA_CLEANUP_CRON:0 15 4 * * *}
asaltamontes.media.orphan-grace-period=${MEDIA_ORPHAN_GRACE_PERIOD:24h}
asaltamontes.media.max-bytes-per-user=${MEDIA_MAX_BYTES_PER_USER:50MB}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Logs: request id (X-Request-Id) on every line logged while serving a request
logging.pattern.level=%5p [%X{requestId:-}]

# Paginated listings: size is capped (not rejected) at 50 for every endpoint using Pageable (BUG-067)
spring.data.web.pageable.max-page-size=50
