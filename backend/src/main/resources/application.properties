spring.application.name=asaltamontes
server.address=0.0.0.0
server.port=8080

# Connection data
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# Cambiar en producción
spring.jpa.show-sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
asaltamontes.jwt.secret-key=${JWT_SECRET}
asaltamontes.jwt.expiration=${JWT_EXPIRATION_MS}
asaltamontes.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# Google OAuth
asaltamontes.google.client-id=${GOOGLE_CLIENT_ID}
asaltamontes.google.client-secret=${GOOGLE_CLIENT_SECRET}

# CORS
asaltamontes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}