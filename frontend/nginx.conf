# Single entry point (T07): the SPA and, on the same origin, the backend API, auth and WebSocket.
# The backend is not published on the LAN; everything goes through here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (T17)
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # ----- Backend -----
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /ws-asaltamontes {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Health checks for external monitoring; every other actuator endpoint stays private
    location /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /actuator {
        return 404;
    }

    # ----- Uploaded images (T17) -----
    # Read-only volume written by the backend. File names are random and never reused, so they are immutable.
    # add_header is repeated because a location that sets its own add_header drops the server-level ones.
    location /media/ {
        alias /var/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        autoindex off;
    }

    # ----- SPA -----
    # Hashed build assets never change: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
