services:
  db:
    image: postgres:17
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asaltamontes
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    # Only reachable from the server itself (e.g. DBeaver through an SSH tunnel), never from the LAN
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Since T08 (PostgreSQL 17). Filled by scripts/db/upgrade-13-to-17.sh before the first deploy
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d asaltamontes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Applied only when the kernel has the memory cgroup enabled (see README, "Memory limits")
    mem_limit: 512m
    networks:
      - asaltamontes-net

  # Daily pg_dump with retention (7 daily + 4 weekly) into the postgres_backups volume (T07b).
  # Same image as `db` so pg_dump always matches the server version. Restore: see README, "Backups".
  backup:
    image: postgres:17
    container_name: db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGDATABASE: asaltamontes
      PGUSER: ${DATABASE_USERNAME}
      PGPASSWORD: ${DATABASE_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./scripts/backup:/scripts:ro
      - postgres_backups:/backups
    # Unhealthy when the newest daily dump is older than 26 h
    healthcheck:
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m
    mem_limit: 128m
    networks:
      - asaltamontes-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # Explicit heap: without the memory cgroup the JVM would size it from the whole host RAM
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--Xms128m -Xmx512m}
    # Not published on the LAN: browsers reach it through nginx (frontend). Localhost only, for debugging.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 768m
    networks:
      - asaltamontes-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks:
      - asaltamontes-net

networks:
  asaltamontes-net:
    driver: bridge

volumes:
  # PostgreSQL 13 data, no longer mounted: kept for rollback (T08). Remove once 17 is validated.
  postgres_data:
  postgres17_data:
  postgres_backups:
