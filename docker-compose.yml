services:
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      - POSTGRES_DB=asaltamontes
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asaltamontes-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "8080:8080"
    networks:
      - asaltamontes-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "80:80"
    args:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - asaltamontes-net

networks:
  asaltamontes-net:
    driver: bridge

volumes:
  postgres_data:
