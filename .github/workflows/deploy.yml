name: Deploy Asaltamontes
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout of the repository
        uses: actions/checkout@v4

      - name: Deploy Asaltamontes
        run: |
          docker compose down
          docker compose --env-file /etc/github-runner.env up --build -d