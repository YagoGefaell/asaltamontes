name: Deploy Asaltamontes
on:
  push:
    branches: [ main ]
    # Documentation and agent tooling do not change the running app
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

# Never two deploys at the same time on the server
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      COMPOSE: docker compose --env-file /etc/github-runner.env
    steps:
      - name: Checkout of the repository
        uses: actions/checkout@v4

      # The current version keeps serving while the new images build
      - name: Build images
        run: $COMPOSE build

      # Recreates only what changed and waits for every healthcheck (fails the job if one never gets healthy)
      - name: Start the new version
        run: $COMPOSE up -d --remove-orphans --wait --wait-timeout 300

      # Containers created while the memory cgroup was disabled have no limit, and compose does not recreate
      # them because their config did not change (BUG-044). Recreate only those, once.
      - name: Apply memory limits to old containers
        run: |
          stale=""
          for service in $($COMPOSE config --format json | jq -r '.services | to_entries[] | select(.value.mem_limit != null) | .key'); do
            id=$($COMPOSE ps -q "$service")
            if [ -n "$id" ] && [ "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" = "0" ]; then
              stale="$stale $service"
            fi
          done
          if [ -n "$stale" ]; then
            echo "Recreating without memory limit:$stale"
            $COMPOSE up -d --force-recreate --no-deps --wait --wait-timeout 300 $stale
          fi

      - name: Smoke test through nginx
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost/actuator/health
          curl -fsS -o /dev/null http://localhost/
          # Auth goes through the proxy too (401 without a refresh cookie is the expected answer)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/auth/refresh)" = "401"

      - name: Show state and logs
        if: failure()
        run: |
          $COMPOSE ps
          $COMPOSE logs --tail 150 backend frontend

      # The build cache and old tagged images grow on every deploy and fill the microSD (BUG-044). Never volumes.
      - name: Clean up build cache and old images
        if: success()
        run: |
          docker builder prune -f --filter until=24h
          docker image prune -a -f --filter until=72h
          docker system df

      - name: Warn if the disk is almost full
        if: always()
        run: |
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          echo "Disk usage: ${used}%"
          if [ "$used" -ge 80 ]; then
            echo "::warning::The server disk is at ${used}%"
          fi
