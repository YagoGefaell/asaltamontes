name: Deploy Asaltamontes
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout of the repository
        uses: actions/checkout@v4

      - name: Deploy Asaltamontes
        run: |
          cp /home/administrador/.env .
          docker compose down
          docker compose --env-file .env up --build -d