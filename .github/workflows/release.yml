name: Release & Versioning

on:
  push:
    branches: [ main ]

jobs:
  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.tag_action.outputs.version }}
      skipped: ${{ steps.tag_action.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Tag and Changelog
        id: tag_action
        uses: Tripping-on-the-Moon/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-message: 'chore(release): {version}'
          preset: 'conventionalcommits'
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'

      - name: Trigger Deploy
        if: steps.tag_action.outputs.skipped == 'false'
        run: |
          echo "Nueva versión en Asaltamontes: ${{ steps.tag_action.outputs.version }}"
